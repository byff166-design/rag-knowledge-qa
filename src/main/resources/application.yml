spring:
  application:
    name: rag-knowledge-qa
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    # H2 文件库：./data/ragdb 重启不丢；面试可改 MySQL/PG（配置见 README「生产部署」）
    url: jdbc:h2:file:./data/ragdb;MODE=MySQL;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true          # 浏览器访问 /h2-console 可视化查表
      path: /h2-console
      settings:
        web-allow-others: true
  sql:
    init:
      mode: always           # 强制执行 schema.sql（H2 文件模式默认不自动跑）

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# ---- RAG 配置 ----
rag:
  dashscope:
    # 阿里云百炼（OpenAI 兼容模式），启动前 set DASHSCOPE_API_KEY=sk-xxx
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: ${DASHSCOPE_API_KEY:sk-placeholder}  # 启动前 set DASHSCOPE_API_KEY=sk-xxx
    chat-model: qwen-plus
    embedding-model: text-embedding-v3
    embedding-dim: 1024
  retrieve:
    max-results: 5
    min-score: 0.6

server:
  port: 8080